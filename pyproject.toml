[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conbot"
version = "1.0.0"
description = "Conference tracking bot for automated deadline monitoring"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ohad", email = "ohad@example.com"}
]
keywords = ["automation", "conference", "monitoring", "deadline-tracking", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # Core
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",

    # Web scraping
    "playwright>=1.40.0",
    "trafilatura>=1.6.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",

    # Date extraction
    "dateparser>=1.2.0",
    "python-dateutil>=2.8.0",

    # LLM (optional)
    "openai>=1.0.0",

    # Email notifications
    "boto3>=1.28.0",
    "jinja2>=3.1.0",

    # Local deployment (SQLite + scheduler)
    "sqlalchemy>=2.0.0",
    "apscheduler>=3.10.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "moto[ses]>=4.2.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-requests>=2.31.0",
    "types-pyyaml>=6.0.0",
    "types-python-dateutil>=2.8.0",
]

[project.scripts]
conbot = "conbot.cli:cli"

[project.urls]
Homepage = "https://github.com/ohad/ConBOT"
Repository = "https://github.com/ohad/ConBOT.git"
Issues = "https://github.com/ohad/ConBOT/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["conbot*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["conbot"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "boto3.*,trafilatura.*,dateparser.*,apscheduler.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src/conbot"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
precision = 2

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "W", "F", "I", "N", "UP"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["conbot"]
