      seed_urls:
        - "http://traconference.eu/"
      include_if_url_contains:
        - "call"
        - "paper"
        - "abstract"
        - "proposal"
        - "session"
        - "submission"
        - "deadline"
        - "dates"
        - "news"
      include_if_anchor_contains:
        - "call for"
        - "submit"
        - "abstract"
        - "paper"
        - "proposal"
        - "session"
        - "important dates"
        - "deadlines"
      max_discovered_urls: 20

  - id: its_world_congress
    name: "ITS World Congress"
    primary_domain: "itsinternational.com"
    urls:
      - "https://www.itsinternational.com/events/its-world-congress-2027"
    secondary_urls:
      - "https://www.itsinternational.com/events"
      - "https://www.itsinternational.com/news"
      - "https://www.itsinternational.com/event/its-world-congress"
      - "https://www.itsinternational.com/tag/its-world-congress"
    fetch_mode: auto
    js_required: true
    link_discovery:
      enabled: true
      seed_urls:
        - "https://www.itsinternational.com/events/its-world-congress-2027"
        - "https://www.itsinternational.com/events"
      include_if_url_contains:
        - "world-congress"
        - "call"
        - "papers"
        - "abstract"
        - "proposal"
        - "submission"
        - "deadline"
        - "dates"
        - "programme"
        - "conference"
      include_if_anchor_contains:
        - "world congress"
        - "call for"
        - "submit"
        - "abstract"
        - "paper"
        - "proposal"
        - "deadline"
        - "important dates"
      max_discovered_urls: 25
      require_same_domain: true
